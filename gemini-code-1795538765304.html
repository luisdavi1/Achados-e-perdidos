<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#111111">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Achados e Perdidos · IEMA Pleno Maria Mônica Vale</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--navy:#0F294A;--blue:#1D63B8;--bg:#F4F6F9;--card:#fff;--ink:#14213a;--mut:#5b6980;--line:#dfe4ec;--lost:#E11D48;--ok:#10B981;--sec:#b45309;--inp:#fff;--tint:#e4edf8;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#12233b;--ink:#e8eef8;--mut:#9fb0c8;--line:#233a5c;--inp:#0d1c31;--tint:#1a3050;--blue:#4f93e6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1424;--card:#12233b;--ink:#e8eef8;--mut:#9fb0c8;--line:#233a5c;--inp:#0d1c31;--tint:#1a3050;--blue:#4f93e6;color-scheme:dark}
html{height:100%;background:var(--navy);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3,.count b,.ph b{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.top{background:var(--navy);color:#fff;padding:18px 16px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-size:1.45rem;font-weight:800;line-height:1.1}.top small{opacity:.75;font-size:.8rem;display:block;margin-top:2px}
.count{text-align:right}.count b{display:block;font-size:2.7rem;font-weight:800;line-height:1;color:#6ee7b7}
.count span{font-size:.72rem;opacity:.85;display:block;max-width:96px;margin-left:auto;line-height:1.2}
main{max-width:720px;margin:0 auto;padding:16px}
h2{font-size:1.2rem;margin:4px 0 12px}
.m{color:var(--mut);font-size:.85rem;margin:2px 0}
.grid{display:grid;gap:14px;margin-top:14px}@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;height:140px;background:var(--tint);display:grid;place-items:center}.ph img{width:100%;height:100%;object-fit:cover}
.ph b{font-size:3rem;color:var(--blue);opacity:.35}
.st{position:absolute;left:10px;top:10px;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;color:#fff}
.lost{background:var(--lost)}.ok{background:#fff;color:#047857;border:1px solid var(--ok)}.sec{background:var(--sec)}.done{background:var(--ok)}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}.cb h3{font-size:1.05rem}.cb p{margin:2px 0}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.btn{border:1px solid transparent;border-radius:10px;padding:10px 14px;font:700 .92rem Figtree,system-ui,sans-serif;background:var(--blue);color:#fff;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.g{background:transparent;color:var(--blue);border-color:var(--line)}.btn.go{background:var(--ok)}.btn.rd{background:var(--lost)}.btn.sm{min-height:38px;padding:6px 12px;font-size:.85rem}.btn.full{width:100%}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--inp);color:var(--ink);min-height:44px}
.f{display:block;margin-bottom:12px}.f>span{display:block;font-size:.85rem;font-weight:700;margin-bottom:4px;color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.seg,.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button[aria-pressed=true].l{background:var(--lost);color:#fff;border-color:transparent}.seg button[aria-pressed=true].r{background:var(--ok);color:#fff;border-color:transparent}
.flt{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}.flt select{font-size:.88rem}
.warn{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:.85rem;margin-bottom:12px}
.err{color:var(--lost);font-weight:700;font-size:.9rem;min-height:1.2em;margin:4px 0 8px}
#pform[data-type=lost] .only-found{display:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px;font:700 1rem Figtree,system-ui,sans-serif;color:var(--mut);cursor:pointer}.tabs button[aria-pressed=true]{color:var(--blue);border-color:var(--blue)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.stats b{display:block;font:800 1.4rem 'Bricolage Grotesque',sans-serif;color:var(--blue)}.stats span{font-size:.7rem;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:4px 6px env(safe-area-inset-bottom,0px);z-index:20}
nav button{flex:1;background:none;border:0;color:var(--mut);font:600 .72rem Figtree,system-ui,sans-serif;display:grid;justify-items:center;gap:2px;padding:6px;min-height:52px;cursor:pointer}nav button[aria-current=page]{color:var(--blue)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:30}.ov[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
@media(min-width:620px){.ov{align-items:center}.sheet{border-radius:18px}}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:grid;gap:8px;z-index:40;pointer-events:none}
.t{max-width:420px;margin:0 auto;padding:11px 14px;border-radius:10px;background:var(--navy);color:#fff;font-weight:600}.t.e{background:var(--lost)}.t.s{background:#047857}
.link{background:none;border:0;color:var(--blue);font:700 .9rem Figtree,sans-serif;cursor:pointer;padding:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .85rem Figtree,sans-serif;cursor:pointer;min-height:40px}.chip[aria-pressed=true]{background:var(--blue);color:#fff;border-color:transparent}
.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:12px;border:2px solid #fff;object-fit:cover;flex:none}
.top{box-shadow:inset 0 -4px 0 var(--red)}.top h1{font-size:1.3rem}
:root{--navy:#111;--red:#E31B2D;--lost:#E31B2D;--ok:#1D63B8;--bg:#F4F5F7;--tint:#e9edf3}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--card:#17171a;--line:#2b2b30;--inp:#111113;--tint:#212226}}
:root[data-theme="dark"]{--bg:#0b0b0d;--card:#17171a;--line:#2b2b30;--inp:#111113;--tint:#212226}
.ok{color:var(--blue)}.sec{background:#111}.done{background:var(--blue)}.btn.go{background:var(--ink);color:var(--card)}.t.s{background:var(--blue)}
nav button[aria-current=page]{color:var(--red)}.tabs button[aria-pressed=true]{border-color:var(--red)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:14px;padding:12px 14px;margin-bottom:12px}.hero .act{padding:0;margin:0}
.foot{text-align:center;color:var(--mut);font-size:.85rem;padding:22px 16px 6px}.foot b{color:var(--ink)}
.chat{max-height:48vh;overflow:auto;display:grid;gap:8px;margin-bottom:10px;align-content:start}.bub{background:var(--tint);border-radius:16px 16px 16px 4px;padding:8px 12px;max-width:85%;justify-self:start;font-size:.95rem;overflow-wrap:anywhere}.bub small{display:block;color:var(--mut);font-size:.7rem}.bub.me{background:var(--blue);color:#fff;justify-self:end;border-radius:16px 16px 4px 16px}.bub.me small{color:#dbe7ff}.badge{background:var(--red);color:#fff;border-radius:999px;padding:1px 8px;font-size:.72rem}
html{background:var(--card)}body{font-family:'Plus Jakarta Sans',Figtree,system-ui,sans-serif}
.btn,.chip,nav button,.tabs button,.link{font-family:'Plus Jakarta Sans',Figtree,system-ui,sans-serif}
.top{background:var(--card);color:var(--ink);box-shadow:inset 0 -1px 0 var(--line);border-top:5px solid var(--red)}.top small{opacity:1;color:var(--mut)}
.top .btn.g{color:var(--ink)!important;border-color:var(--line)!important}
.logo{border:0;box-shadow:0 0 0 2px var(--line)}
.card,.panel,.hero,.stats div{border-radius:20px;box-shadow:0 2px 12px #0f172a12}.btn,.chip{border-radius:999px}input,select,textarea{border-radius:14px}
.ph{height:160px}nav{border-radius:22px 22px 0 0}nav button{font-size:.66rem;padding:6px 2px}
</style>
</head>

/* ========= RATE LIMIT (ANTI-SPAM) ========= */
const RL_KEY='iema_rl_v1';
const RL_RULES={
  post:{max:3,win:15*60e3,cool:30e3,label:'publicar ocorrências'},
  claim:{max:5,win:10*60e3,cool:15e3,label:'enviar avisos'},
  chat:{max:8,win:2*60e3,cool:3e3,label:'enviar mensagens no suporte'},
  login:{max:5,win:5*60e3,cool:2e3,label:'tentar entrar'},
  reg:{max:2,win:30*60e3,cool:10e3,label:'criar contas'}
};
const fmtWait=ms=>{const s=Math.ceil(ms/1e3);return s<60?`${s}s`:`${Math.ceil(s/60)} min`};
function checkRate(act,who){
  const r=RL_RULES[act];if(!r)return '';
  const now=Date.now(),id=`${act}:${who||'anon'}`,all=db.get(RL_KEY,{});
  const list=(all[id]||[]).filter(t=>now-t<r.win);
  if(list.length){
    const last=list[list.length-1];
    if(now-last<r.cool)return `Aguarde ${fmtWait(r.cool-(now-last))} antes de ${r.label} novamente.`;
    if(list.length>=r.max)return `Limite atingido para ${r.label} (${r.max}x). Tente novamente em ${fmtWait(r.win-(now-list[0]))}.`;
  }
  return '';
}
function hitRate(act,who){
  const r=RL_RULES[act];if(!r)return;
  const now=Date.now(),id=`${act}:${who||'anon'}`,all=db.get(RL_KEY,{});
  all[id]=[...(all[id]||[]).filter(t=>now-t<r.win),now];
  db.set(RL_KEY,all);
}

function sendChat(text){const t=(text||'').trim();if(!t)return;const adm=isAdmin(S.user),uid=adm?S.cu:S.user.id;if(!uid)return;
 if(!adm){const rl=checkRate('chat',S.user.id);if(rl)return toast(rl,'e');hitRate('chat',S.user.id)}

function forgot(){openM(`<h2>Redefinir senha</h2><p class="m">Protótipo: em produção, o link de redefinição chega por e-mail.</p>${fld('E-mail','<input id="fg-l" type="email" list="dom">')}${fld('Nova senha','<input id="fg-p" type="password">')}<div class="err" id="err"></div><div class="two"><button class="btn g" data-act="close">Cancelar</button><button class="btn" data-act="fgo">Salvar senha</button></div>`)}
function fgo(){const l=val('fg-l').toLowerCase(),p=$('#fg-p').value,u=users().find(x=>x.login.toLowerCase()===l);if(!u)return showErr('Cadastro não encontrado.');if(p.length<6)return showErr('A nova senha precisa ter 6 caracteres ou mais.');saveUsers(users().map(x=>x.id===u.id?{...x,pw:h(p)}:x));closeM();toast('Senha atualizada. Entre com a nova senha.')}
function readPhoto(f){return new Promise((ok,no)=>{if(!f.type.startsWith('image/'))return no();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
function publish(){const rl=checkRate('post',S.user.id);if(rl)return showErr(rl);
 const type=$('#pform').dataset.type,f=type==='found',d={title:val('p-title'),cat:val('p-cat'),loc:val('p-loc'),date:val('p-date')};
 const err=d.title.length<3?'Dê um título ao item.':!d.cat?'Escolha uma categoria.':!d.loc?'Escolha o local na escola.':!d.date||d.date>today()?'Informe uma data válida (não pode ser futura).':!/^\(\d{2}\) 9\d{4}-\d{4}$/.test(val('p-phone'))?'Informe um WhatsApp válido para contato.':'';if(err)return showErr(err);
 hitRate('post',S.user.id);
 const u=S.user;saveItems([{id:'i'+Date.now(),created:Date.now(),type,title:d.title,cat:d.cat,loc:d.loc,locx:[d.loc==='Salas de aula'?val('p-sala'):'',val('p-locx')].filter(Boolean).join(' · '),turno:val('p-turno'),date:d.date,desc:val('p-desc'),photo:S.photo,custody:f?(val('p-cust').startsWith('Foi')?'secretaria':'comigo'):'',q:f?val('p-q'):'',owner:u.id,ownerName:u.name,ownerPhone:val('p-phone'),returned:false,archived:false,claims:[]},...items()]);
 S.photo='';S.view='feed';render();toast('Ocorrência publicada.')}
function claimM(id){const i=find(id),f=i.type==='found';
 openM(`<h2>${f?'Este item é meu':'Eu encontrei'}</h2><p class="m">${esc(i.title)}</p>${f&&i.q?fld('Pergunta de segurança: '+esc(i.q),'<input id="c-ans" autocomplete="off">'):''}${fld('Sua turma ou setor',`<input id="c-turma" value="${esc(S.user.turma||S.user.role)}">`)}${fld('Seu WhatsApp (o dono vai te chamar por aqui)',`<input id="c-phone" inputmode="tel" value="${esc(S.user.phone)}">`)}${fld(f?'Mensagem para o dono (opcional)':'Mensagem para o dono: onde você achou o item?',`<textarea id="c-msg" rows="2" maxlength="160"></textarea>`)}<div class="err" id="err"></div><div class="two"><button class="btn g" data-act="close">Cancelar</button><button class="btn" data-act="claimgo" data-id="${id}">Enviar</button></div>`)}
function claimGo(id){const rl=checkRate('claim',S.user.id);if(rl)return showErr(rl);
 const i=find(id),f=i.type==='found',ans=val('c-ans'),t=val('c-turma');
 if(i.claims.some(c=>c.by===S.user.id&&c.st==='wait'))return showErr('Você já enviou um aviso para este item. Aguarde a análise do dono.');
 if(f&&i.q&&!ans)return showErr('Responda à pergunta de segurança.');const ph=val('c-phone'),note=val('c-msg');if(!/^\(\d{2}\) 9\d{4}-\d{4}$/.test(ph))return showErr('Informe seu WhatsApp no formato (98) 9XXXX-XXXX.');if(!t)return showErr('Informe sua turma ou setor.');
 hitRate('claim',S.user.id);
 upd(id,x=>x.claims.push({by:S.user.id,name:S.user.name,turma:t,ans,phone:ph,note,at:Date.now(),seen:false,st:'wait'}));
 const sec=i.custody==='secretaria',msg=`Olá! Vi sua publicação no Achados e Perdidos do IEMA Maria Mônica Vale sobre o item ${i.title}. ${f?'Acredito que ele é meu.':'Eu encontrei esse item.'} Sou ${S.user.name} (${t}).${ans?' Resposta de segurança: '+ans+'.':''}${note?' '+note:''} Meu WhatsApp: ${ph}.${sec&&f?' Posso retirar na Secretaria?':''}`,
 wa=`https://wa.me/55${i.ownerPhone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;
 openM(`<h2>Pedido enviado</h2><p>${sec?'O item está guardado na Coordenação / Secretaria. Leve um documento de identificação e diga o nome do item para retirar.':'O dono foi avisado no app e verá seu número. Se preferir, chame agora pelo WhatsApp.'}</p><a class="btn go" href="${esc(wa)}" target="_blank" rel="noopener">Chamar no WhatsApp</a><button class="btn g" data-act="close">Fechar</button>`);toast('Pedido enviado.')}
function confirmM(m,fn){S.pending=fn;openM(`<h2>Confirmar</h2><p>${m}</p><div class="two"><button class="btn g" data-act="close">Voltar</button><button class="btn" data-act="yes">Confirmar</button></div>`)}
const A={
 auth:id=>{S.auth=id;render()},login:doLogin,reg:doReg,forgot,fgo,close:closeM,
 go:id=>{if(id==='me')markSeen();if(id==='chat'){S.cu=null;if(!isAdmin(S.user))chatSeen(S.user.id)}S.view=id;render();scrollTo(0,0)},
 chip:v=>{S.f.st=v;render()},
 copen:id=>{S.cu=id;chatSeen(id);render()},cback:()=>{S.cu=null;render()},csend:()=>sendChat(val('c-text')),qmsg:t=>sendChat(t),
 clear:()=>{S.f={q:'',cat:'',loc:'',st:'',tur:''};render()},
 newpost:id=>{S.view='post';render();scrollTo(0,0);A.ptype(id)},
 theme:()=>{const n=dark()?'light':'dark';document.documentElement.dataset.theme=n;db.set('iema_theme',n);render()},
 ptype:id=>{$('#pform').dataset.type=id;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));match()},
 publish,claim:claimM,claimgo:claimGo,
 ret:id=>confirmM('Marcar este item como devolvido? Ele passa a contar em “itens recuperados”.',()=>{upd(id,i=>{i.returned=true;i.returnedAt=Date.now()});db.set(K.c,db.get(K.c,0)+1);closeM();render();toast('Devolução confirmada. +1 item recuperado!')}),
 del:id=>confirmM('Excluir esta publicação?',()=>{saveItems(items().filter(i=>i.id!==id));closeM();render();toast('Publicação excluída.')}),
 recv:id=>{upd(id,i=>i.custody='secretaria');render();toast('Recebimento registrado.')},
 arch:id=>{upd(id,i=>i.archived=true);render();toast('Devolução arquivada.')},
 yes:()=>S.pending&&S.pending(),
 edit:id=>{const i=find(id),f=i.type==='found';openM(`<h2>Editar publicação</h2>${fld('Título',`<input id="e-title" maxlength="60" value="${esc(i.title)}">`)}${fld('Categoria',sel('e-cat',CATS))}${fld('Local na escola',sel('e-loc',LOCS))}${fld('Complemento do local',`<input id="e-locx" value="${esc(i.locx)}">`)}${fld('Descrição',`<textarea id="e-desc" rows="2" maxlength="200">${esc(i.desc)}</textarea>`)}${f?fld('Onde o item está?',sel('e-cust',['Está comigo','Foi entregue na Coordenação / Secretaria']))+fld('Pergunta de validação',`<input id="e-q" maxlength="80" value="${esc(i.q)}">`):''}<div class="err" id="err"></div><div class="two"><button class="btn g" data-act="close">Cancelar</button><button class="btn" data-act="editgo" data-id="${id}">Salvar</button></div>`);$('#e-cat').value=i.cat;$('#e-loc').value=i.loc;if(f)$('#e-cust').value=i.custody==='secretaria'?'Foi entregue na Coordenação / Secretaria':'Está comigo'},
 editgo:id=>{const t=val('e-title');if(t.length<3)return showErr('Dê um título ao item.');upd(id,i=>{i.title=t;i.cat=val('e-cat');i.loc=val('e-loc');i.locx=val('e-locx');i.desc=val('e-desc');if(i.type==='found'){i.custody=val('e-cust').startsWith('Foi')?'secretaria':'comigo';i.q=val('e-q')}});closeM();render();toast('Publicação atualizada.')},
 cst:id=>{const[iid,at,st]=id.split('|');upd(iid,i=>i.claims.forEach(c=>{if(String(c.at)===at)c.st=st}));render();toast(st==='ok'?'Pedido marcado como válido.':'Pedido recusado.')},
 tadd:()=>{const v=val('t-new');if(v.length<2)return toast('Digite o nome da sala ou turma.','e');if(TURMAS.includes(v))return toast('Essa turma já existe.','e');TURMAS=[...TURMAS,v];db.set('iema_turmas',TURMAS);render();toast('Turma adicionada.')},
 tdel:id=>{TURMAS=TURMAS.filter((_,k)=>k!=id);db.set('iema_turmas',TURMAS);render();toast('Turma removida.')},
 csv:()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',r=[['Status','Título','Categoria','Local','Data','Turno','Guarda','Publicado por','Contato','Pedidos']].concat(items().map(i=>[status(i),i.title,i.cat,i.loc+(i.locx?' - '+i.locx:''),fmt(i.date),i.turno,i.custody||'',i.ownerName,i.ownerPhone,i.claims.length]));openM(`<h2>Resumo (CSV)</h2><p class="m">Toque na caixa, selecione tudo e copie. Cole em uma planilha.</p><textarea rows="8" readonly onfocus="this.select()">${esc(r.map(x=>x.map(q).join(';')).join('\n'))}</textarea><button class="btn g" data-act="close">Fechar</button>`)},
 reset:()=>confirmM('Apagar todos os dados e voltar à demonstração inicial? Contas e publicações criadas serão perdidas.',()=>{[K.u,K.i,K.c,K.s,RL_KEY,'iema_turmas'].forEach(k=>db.del(k));TURMAS=TDEF;S.user=null;S.view='feed';S.auth='login';closeM();seed();render();toast('Dados de demonstração restaurados.')}),
 phone:()=>openM(`<h2>Meu WhatsApp</h2><p class="m">É este número que as pessoas usam para falar com você.</p>${fld('WhatsApp',`<input id="m-phone" inputmode="tel" value="${esc(S.user.phone)}">`)}<div class="err" id="err"></div><div class="two"><button class="btn g" data-act="close">Cancelar</button><button class="btn" data-act="phonego">Salvar número</button></div>`),
 phonego:()=>{const p=val('m-phone');if(!/^\(\d{2}\) 9\d{4}-\d{4}$/.test(p))return showErr('Use o formato (98) 9XXXX-XXXX.');S.user.phone=p;saveUsers(users().map(x=>x.id===S.user.id?{...x,phone:p}:x));saveItems(items().map(i=>i.owner===S.user.id&&!i.returned?{...i,ownerPhone:p}:i));closeM();render();toast('Número atualizado.')},
 logout:()=>{db.del(K.s);S.user=null;S.view='feed';render();toast('Você saiu da conta.')}
};
document.addEventListener('click',e=>{if(e.target===ov)return closeM();const t=e.target.closest('[data-act]');if(t)A[t.dataset.act]?.(t.dataset.id)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){S.f.q=t.value;drawList()}if(['r-phone','c-phone','m-phone','p-phone'].includes(t.id))t.value=mask(t.value);
 if(['l-login','r-login','fg-l'].includes(t.id)){const[a,b='']=t.value.split('@');$('#dom').innerHTML=t.value.includes('@')?DOMS.filter(d=>d.startsWith(b)&&d!==b).map(d=>`<option value="${esc(a)}@${d}">`).join(''):''}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id.startsWith('f-')){S.f[t.id.slice(2)]=t.value;drawList()}
 if(t.id==='p-loc')$('#p-saw').style.display=t.value==='Salas de aula'?'':'none';
 if(t.id==='p-cat'||t.id==='p-loc')match();
 if(t.id==='r-role')$('#r-tw').style.display=t.value==='Estudante'||!t.value?'':'none';
 if(t.id==='p-photo'&&t.files[0]){try{S.photo=await readPhoto(t.files[0]);$('#p-prev').innerHTML=`<img src="${S.photo}" alt="Prévia da foto" style="max-width:100%;border-radius:10px;margin-bottom:12px">`}catch(x){S.photo='';t.value='';toast('Não foi possível ler essa imagem.','e')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='search'){const p=e.target.closest('.panel'),b=p&&p.querySelector('.btn.full');if(b&&!S.user)b.click()}});

const th=db.get('iema_theme');if(th)document.documentElement.dataset.theme=th;
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='c-text')A.csend()});
const ic=document.createElement('link');ic.rel='icon';ic.href=LOGO;document.head.append(ic);
seed();S.user=users().find(u=>u.id===db.get(K.s))||null;render();
</script>
</body>
</html>
