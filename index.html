<style>
*{box-sizing:border-box}
:root{
  --navy:#1B4965;
  --blue:#5FA8D3;
  --baby:#89CFF0;
  --bg:#F4FAFE;
  --card:#FFFFFF;
  --ink:#133146;
  --mut:#527691;
  --line:#D4ECFA;
  --lost:#E11D48;
  --ok:#3B8EC2;
  --sec:#1B4965;
  --inp:#FFFFFF;
  --tint:#E3F4FD;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1E2D;
    --card:#122B40;
    --ink:#E6F4FD;
    --mut:#94BBD6;
    --line:#204563;
    --inp:#0E2334;
    --tint:#183852;
    --blue:#89CFF0;
    --ok:#89CFF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1E2D;
  --card:#122B40;
  --ink:#E6F4FD;
  --mut:#94BBD6;
  --line:#204563;
  --inp:#0E2334;
  --tint:#183852;
  --blue:#89CFF0;
  --ok:#89CFF0;
  color-scheme:dark;
}
html{height:100%;background:var(--card);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 'Plus Jakarta Sans',Figtree,system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3,.count b,.ph b{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;letter-spacing:-.01em}

.top{background:var(--card);color:var(--ink);padding:16px 16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:6px solid var(--baby);box-shadow:inset 0 -1px 0 var(--line),0 2px 12px rgba(95,168,211,.10)}
.top h1{font-size:1.3rem;font-weight:800;line-height:1.1;color:var(--ink)}
.top small{opacity:1;color:var(--mut);font-size:.8rem;display:block;margin-top:2px}

.theme-sw{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:space-between;
  width:56px;
  height:30px;
  padding:3px;
  border-radius:999px;
  border:1.5px solid var(--line);
  background:var(--tint);
  cursor:pointer;
  flex:none;
  transition:background .25s ease,border-color .25s ease;
}
.theme-sw .ico{
  position:relative;
  z-index:1;
  width:22px;
  height:22px;
  display:grid;
  place-items:center;
  color:var(--navy);
  transition:opacity .2s ease,transform .25s ease;
}
:root[data-theme="dark"] .theme-sw .ico{color:var(--baby)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-sw .ico{color:var(--baby)}}
.theme-sw svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.theme-sw .thumb{
  position:absolute;
  top:3px;
  left:3px;
  width:22px;
  height:22px;
  border-radius:999px;
  background:#FFFFFF;
  box-shadow:0 2px 6px rgba(19,49,70,.22);
  border:1px solid var(--baby);
  transition:transform .25s cubic-bezier(.4,0,.2,1),background .25s ease;
}
.theme-sw.is-dark .thumb{
  transform:translateX(26px);
  background:var(--baby);
  border-color:var(--baby);
}
.theme-sw.is-dark .ico-moon{color:#0D2B40}

main{max-width:720px;margin:0 auto;padding:16px}
h2{font-size:1.2rem;margin:4px 0 12px;color:var(--ink)}
.m{color:var(--mut);font-size:.85rem;margin:2px 0}
.grid{display:grid;gap:14px;margin-top:14px}@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}

.card,.panel,.hero,.stats div{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 3px 14px rgba(95,168,211,.08)}
.card{overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;height:160px;background:var(--tint);display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover}
.ph b{font-size:3rem;color:var(--blue);opacity:.45}

.st{position:absolute;left:10px;top:10px;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;color:#fff}
.lost{background:var(--lost)}
.ok{background:#FFFFFF;color:var(--navy);border:1.5px solid var(--baby)}
.sec{background:var(--navy);color:#fff}
.done{background:var(--blue);color:#fff}

.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}.cb h3{font-size:1.05rem}.cb p{margin:2px 0}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:10px}

.btn,.chip,nav button,.tabs button,.link{font-family:'Plus Jakarta Sans',Figtree,system-ui,sans-serif}
.btn{border:1px solid transparent;border-radius:999px;padding:10px 15px;font:700 .92rem 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--baby);color:#0D2B40;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{background:var(--blue);color:#fff}
.btn.g{background:#FFFFFF;color:var(--navy);border-color:var(--line)}
:root[data-theme="dark"] .btn.g{background:transparent;color:var(--baby)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.g{background:transparent;color:var(--baby)}}
.btn.go{background:var(--navy);color:#fff}
.btn.rd{background:var(--lost);color:#fff}
.btn.sm{min-height:38px;padding:6px 13px;font-size:.85rem}
.btn.full{width:100%}
:focus-visible{outline:3px solid var(--baby);outline-offset:2px}

input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:14px;background:var(--inp);color:var(--ink);min-height:44px}
.f{display:block;margin-bottom:12px}.f>span{display:block;font-size:.85rem;font-weight:700;margin-bottom:4px;color:var(--mut)}
.panel{padding:16px}
.seg,.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button[aria-pressed=true].l{background:var(--lost);color:#fff;border-color:transparent}
.seg button[aria-pressed=true].r{background:var(--baby);color:#0D2B40;border-color:transparent}
.seg button[aria-pressed=true].ch-active{background:var(--navy);color:#fff;border-color:transparent}
.flt{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}.flt select{font-size:.88rem}
.warn{background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.85rem;margin-bottom:12px}
.err{color:var(--lost);font-weight:700;font-size:.9rem;min-height:1.2em;margin:4px 0 8px}
#pform[data-type=lost] .only-found{display:none}

.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px;font:700 1rem 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--mut);cursor:pointer}
.tabs button[aria-pressed=true]{color:var(--navy);border-color:var(--baby)}
:root[data-theme="dark"] .tabs button[aria-pressed=true]{color:var(--baby)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-pressed=true]{color:var(--baby)}}

.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.stats div{padding:8px;text-align:center}.stats b{display:block;font:800 1.4rem 'Bricolage Grotesque',sans-serif;color:var(--blue)}.stats span{font-size:.7rem;color:var(--mut)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;display:flex;padding:4px 6px env(safe-area-inset-bottom,0px);z-index:20}
nav button{flex:1;background:none;border:0;color:var(--mut);font:600 .66rem 'Plus Jakarta Sans',system-ui,sans-serif;display:grid;justify-items:center;gap:2px;padding:6px 2px;min-height:52px;cursor:pointer}
nav button[aria-current=page]{color:var(--blue);font-weight:700}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.ov{position:fixed;inset:0;background:rgba(19,49,70,.5);display:flex;align-items:flex-end;justify-content:center;z-index:30}.ov[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
@media(min-width:620px){.ov{align-items:center}.sheet{border-radius:18px}}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:grid;gap:8px;z-index:40;pointer-events:none}
.t{max-width:420px;margin:0 auto;padding:11px 14px;border-radius:12px;background:var(--navy);color:#fff;font-weight:600}.t.e{background:var(--lost)}.t.s{background:var(--blue)}
.link{background:none;border:0;color:var(--blue);font:700 .9rem 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;padding:8px 0}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .85rem 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;min-height:40px}
.chip[aria-pressed=true]{background:var(--baby);color:#0D2B40;border-color:transparent;font-weight:700}

.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:12px;border:0;box-shadow:0 0 0 2px var(--line);object-fit:cover;flex:none}
.hero{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-left:5px solid var(--baby);padding:12px 14px;margin-bottom:12px}
.hero .act{padding:0;margin:0}
.foot{text-align:center;color:var(--mut);font-size:.85rem;padding:22px 16px 6px}.foot b{color:var(--ink)}

.chat{max-height:48vh;overflow:auto;display:grid;gap:8px;margin-bottom:10px;align-content:start}
.bub{background:var(--tint);border-radius:16px 16px 16px 4px;padding:8px 12px;max-width:85%;justify-self:start;font-size:.95rem;overflow-wrap:anywhere}
.bub small{display:block;color:var(--mut);font-size:.7rem}
.bub.me{background:var(--baby);color:#0D2B40;justify-self:end;border-radius:16px 16px 4px 16px}
.bub.me small{color:#234E6B}
.badge{background:var(--baby);color:#0D2B40;border-radius:999px;padding:1px 8px;font-size:.72rem;font-weight:700}
</style>
</head>

/* ========= VALIDAÇÃO: GMAIL + WHATSAPP VÁLIDO ========= */
function validEmail(email){
  const v=(email||'').trim().toLowerCase();
  if(!/^[a-z0-9._%+-]+@gmail\.com$/.test(v))return 'Use um endereço @gmail.com válido.';
  const [local]=v.split('@');
  if(local.length<3||/^(.)\1{2,}$/.test(local)||/^(teste|test|fake|admin|usuario|user|fulano|ciclano|beltrano|abc|qwerty|asdf)$/i.test(local))
    return 'Use um endereço @gmail.com real (não genérico ou aleatório).';
  return '';
}
function validPhone(phone){
  const d=(phone||'').replace(/\D/g,'');
  if(d.length!==11)return 'WhatsApp deve ter DDD + 9 dígitos no formato (98) 9XXXX-XXXX.';
  const ddd=Number(d.slice(0,2));
  if(ddd<11||ddd>99)return 'DDD inválido no número de WhatsApp.';
  if(d[2]!=='9')return 'Celular no Brasil deve começar com 9 após o DDD.';
  const sub=d.slice(2);
  if(/^(.)\1{8}$/.test(sub))return 'Número de WhatsApp inválido (dígitos repetidos).';
  if(sub==='900000000'||sub==='911111111'||sub==='912345678'||sub==='987654321'||sub==='999999999')
    return 'Informe um número de WhatsApp real, não fictício ou sequencial.';
  if(/000000$/.test(sub)||/123456$/.test(sub)||/999999$/.test(sub))
    return 'Número de WhatsApp parece aleatório ou fictício.';
  return '';
}

/* ========= RATE LIMIT (MÁXIMO 3 TENTATIVAS) ========= */
const RL_KEY='iema_rl_v2';
const RL_RULES={
  post:{max:3,win:15*60e3,cool:30e3,label:'publicar ocorrências'},
  claim:{max:3,win:10*60e3,cool:15e3,label:'enviar avisos'},
  chat:{max:3,win:2*60e3,cool:3e3,label:'enviar mensagens no suporte'},
  login:{max:3,win:5*60e3,cool:3e3,label:'tentar entrar'},
  reg:{max:3,win:30*60e3,cool:10e3,label:'enviar códigos e criar contas'}
};
const fmtWait=ms=>{const s=Math.ceil(ms/1e3);return s<60?`${s}s`:`${Math.ceil(s/60)} min`};
function checkRate(act,who){
  const r=RL_RULES[act];if(!r)return '';
  const now=Date.now(),id=`${act}:${who||'anon'}`,all=db.get(RL_KEY,{});
  const list=(all[id]||[]).filter(t=>now-t<r.win);
  if(list.length){
    const last=list[list.length-1];
    if(now-last<r.cool)return `Aguarde ${fmtWait(r.cool-(now-last))} antes de ${r.label} novamente.`;
    if(list.length>=r.max)return `Limite de ${r.max} tentativas atingido para ${r.label}. Aguarde ${fmtWait(r.win-(now-list[0]))}.`;
  }
  return '';
}
function hitRate(act,who){
  const r=RL_RULES[act];if(!r)return;
  const now=Date.now(),id=`${act}:${who||'anon'}`,all=db.get(RL_KEY,{});
  all[id]=[...(all[id]||[]).filter(t=>now-t<r.win),now];
  db.set(RL_KEY,all);
}

const OTP_CONFIG={
  gmailUrl: window.GMAIL_OTP_WEBHOOK_URL || '/api/otp-gmail',

  headers: { 'Content-Type': 'application/json' }
};
let PENDING_OTP=null;
function genOtpCode(){return String(Math.floor(100000+Math.random()*900000))}
function formatPhoneE164(phone){
  const d=(phone||'').replace(/\D/g,'');
  return d.startsWith('55')?`+${d}`:`+55${d}`;
}
async function sendGmailCode({email,code,purpose}){
  const target=email.trim().toLowerCase();
  const res=await fetch(OTP_CONFIG.gmailUrl,{
    method:'POST',
    headers:OTP_CONFIG.headers,
    body:JSON.stringify({channel:'gmail',email:target,target,code,purpose})
  });
  let data={};
  try{data=await res.json()}catch(_){}
  if(!res.ok||data.ok===false)throw new Error(data.error||'Falha ao enviar código por Gmail.');
  return {ok:true,channel:'gmail',target};
}
async function sendWhatsappCode({phone,code,purpose}){
  const target=formatPhoneE164(phone);
  const res=await fetch(OTP_CONFIG.whatsappUrl,{
    method:'POST',
    headers:OTP_CONFIG.headers,
    body:JSON.stringify({channel:'whatsapp',phone:target,target,code,purpose})
  });
  let data={};
  try{data=await res.json()}catch(_){}

function readPhoto(f){return new Promise((ok,no)=>{if(!f.type.startsWith('image/'))return no();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
function readProofDoc(f){
  return new Promise((ok,no)=>{
    if(!f)return no('Nenhum arquivo selecionado.');
    if(f.size>2*1024*1024)return no('O arquivo deve ter no máximo 2 MB.');
    if(f.type.startsWith('image/')){
      readPhoto(f).then(data=>ok({name:f.name,type:'image/jpeg',data})).catch(()=>no('Não foi possível ler essa imagem.'));
      return;
    }
    if(f.type==='application/pdf'){
      const r=new FileReader();
      r.onload=()=>ok({name:f.name,type:'application/pdf',data:r.result});
      r.onerror=()=>no('Não foi possível ler o PDF.');
      r.readAsDataURL(f);
      return;
    }
    no('Envie apenas imagem (JPG, PNG, WEBP) ou PDF.');
  });
}

 ret:id=>confirmM('Marcar este item como devolvido? Ele passa a contar em “itens recuperados”.',()=>{upd(id,i=>{i.returned=true;i.returnedAt=Date.now()});db.set(K.c,db.get(K.c,0)+1);closeM();render();toast('Devolução confirmada. +1 item recuperado!')}),
 del:id=>confirmM('Excluir esta publicação?',()=>{saveItems(items().filter(i=>i.id!==id));closeM();render();toast('Publicação excluída.')}),
 recv:id=>{upd(id,i=>i.custody='secretaria');render();toast('Recebimento registrado.')},
 arch:id=>{upd(id,i=>i.archived=true);render();toast('Devolução arquivada.')},
 yes:()=>S.pending&&S.pending(),
 edit:id=>{const i=find(id),f=i.type==='found';openM(`<h2>Editar publicação</h2>${fld('Título',`<input id="e-title" maxlength="60" value="${esc(i.title)}">`)}${fld('Categoria',sel('e-cat',CATS))}${fld('Local na escola',sel('e-loc',LOCS))}${fld('Complemento do local',`<input id="e-locx" value="${esc(i.locx)}">`)}${fld('Descrição',`<textarea id="e-desc" rows="2" maxlength="200">${esc(i.desc)}</textarea>`)}${f?fld('Onde o item está?',sel('e-cust',['Está comigo','Foi entregue na Coordenação / Secretaria']))+fld('Pergunta de validação',`<input id="e-q" maxlength="80" value="${esc(i.q)}">`):''}<div class="err" id="err"></div><div class="two"><button class="btn g" data-act="close">Cancelar</button><button class="btn" data-act="editgo" data-id="${id}">Salvar</button></div>`);$('#e-cat').value=i.cat;$('#e-loc').value=i.loc;if(f)$('#e-cust').value=i.custody==='secretaria'?'Foi entregue na Coordenação / Secretaria':'Está comigo'},
 editgo:id=>{const t=val('e-title');if(t.length<3)return showErr('Dê um título ao item.');upd(id,i=>{i.title=t;i.cat=val('e-cat');i.loc=val('e-loc');i.locx=val('e-locx');i.desc=val('e-desc');if(i.type==='found'){i.custody=val('e-cust').startsWith('Foi')?'secretaria':'comigo';i.q=val('e-q')}});closeM();render();toast('Publicação atualizada.')},
 cst:id=>{const[iid,at,st]=id.split('|');upd(iid,i=>i.claims.forEach(c=>{if(String(c.at)===at)c.st=st}));render();toast(st==='ok'?'Pedido marcado como válido.':'Pedido recusado.')},
 tadd:()=>{const v=val('t-new');if(v.length<2)return toast('Digite o nome da sala ou turma.','e');if(TURMAS.includes(v))return toast('Essa turma já existe.','e');TURMAS=[...TURMAS,v];db.set('iema_turmas',TURMAS);render();toast('Turma adicionada.')},
 tdel:id=>{TURMAS=TURMAS.filter((_,k)=>k!=id);db.set('iema_turmas',TURMAS);render();toast('Turma removida.')},
 csv:()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',r=[['Status','Título','Categoria','Local','Data','Turno','Guarda','Publicado por','Contato','Pedidos']].concat(items().map(i=>[status(i),i.title,i.cat,i.loc+(i.locx?' - '+i.locx:''),fmt(i.date),i.turno,i.custody||'',i.ownerName,i.ownerPhone,i.claims.length]));openM(`<h2>Resumo (CSV)</h2><p class="m">Toque na caixa, selecione tudo e copie. Cole em uma planilha.</p><textarea rows="8" readonly onfocus="this.select()">${esc(r.map(x=>x.map(q).join(';')).join('\n'))}</textarea><button class="btn g" data-act="close">Fechar</button>`)},
 reset:()=>confirmM('Apagar todos os dados e voltar à demonstração inicial? Contas e publicações criadas serão perdidas.',()=>{[K.u,K.i,K.c,K.s,RL_KEY,'iema_turmas'].forEach(k=>db.del(k));TURMAS=TDEF;S.user=null;S.view='feed';S.auth='login';S.otpCh='gmail';S.profDoc=null;PENDING_OTP=null;closeM();seed();render();toast('Dados de demonstração restaurados.')}),
 phone:()=>openM(`<h2>Meu WhatsApp</h2><p class="m">É este número que as pessoas usam para falar com você.</p>${fld('WhatsApp',`<input id="m-phone" inputmode="tel" value="${esc(S.user.phone)}">`)}<div class="err" id="err"></div><div class="two"><button class="btn g" data-act="close">Cancelar</button><button class="btn" data-act="phonego">Salvar número</button></div>`),
 phonego:()=>{const p=val('m-phone'),ePhone=validPhone(p);if(ePhone)return showErr(ePhone);S.user.phone=p;saveUsers(users().map(x=>x.id===S.user.id?{...x,phone:p}:x));saveItems(items().map(i=>i.owner===S.user.id&&!i.returned?{...i,ownerPhone:p}:i));closeM();render();toast('Número atualizado.')},
 logout:()=>{db.del(K.s);S.user=null;S.view='feed';render();toast('Você saiu da conta.')}
};
document.addEventListener('click',e=>{if(e.target===ov)return closeM();const t=e.target.closest('[data-act]');if(t)A[t.dataset.act]?.(t.dataset.id)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){S.f.q=t.value;drawList()}if(['r-phone','c-phone','m-phone','p-phone','r-otp-zap','fg-dest'].includes(t.id)&&t.inputMode==='tel')t.value=mask(t.value);
 if(['l-login','r-login','fg-l','r-otp-gmail','fg-dest'].includes(t.id)&&t.type==='email'){const[a,b='']=t.value.split('@');$('#dom').innerHTML=t.value.includes('@')?DOMS.filter(d=>d.startsWith(b)&&d!==b).map(d=>`<option value="${esc(a)}@${d}">`).join(''):''}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id.startsWith('f-')){S.f[t.id.slice(2)]=t.value;drawList()}
 if(t.id==='p-loc')$('#p-saw').style.display=t.value==='Salas de aula'?'':'none';
 if(t.id==='p-cat'||t.id==='p-loc')match();
 if(t.id==='r-role'){
   const isProf=t.value==='Professor(a)';
   $('#r-tw').style.display=isProf?'none':'';
   $('#r-pw-box').style.display=isProf?'':'none';
   $('#r-prof-note').style.display=isProf?'':'none';
 }
 if(t.id==='r-doc'&&t.files[0]){
   try{
     S.profDoc=await readProofDoc(t.files[0]);
     $('#r-doc-prev').innerHTML=S.profDoc.type==='application/pdf'
       ?`<div class="warn">PDF anexado: <b>${esc(S.profDoc.name)}</b></div>`
       :`<img src="${S.profDoc.data}" alt="Prévia do comprovante" style="max-width:100%;max-height:180px;border-radius:10px;margin-bottom:12px">`;
   }catch(msg){
     S.profDoc=null;t.value='';$('#r-doc-prev').innerHTML='';toast(typeof msg==='string'?msg:'Não foi possível ler o anexo.','e');
   }
 }
 if(t.id==='p-photo'&&t.files[0]){try{S.photo=await readPhoto(t.files[0]);$('#p-prev').innerHTML=`<img src="${S.photo}" alt="Prévia da foto" style="max-width:100%;border-radius:10px;margin-bottom:12px">`}catch(x){S.photo='';t.value='';toast('Não foi possível ler essa imagem.','e')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='search'){const p=e.target.closest('.panel'),b=p&&p.querySelector('.btn.full');if(b&&!S.user)b.click()}});

const th=db.get('iema_theme');if(th)document.documentElement.dataset.theme=th;
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='c-text')A.csend()});
const ic=document.createElement('link');ic.rel='icon';ic.href=LOGO;document.head.append(ic);
seed();S.user=users().find(u=>u.id===db.get(K.s))||null;render();
</script>
</body>
</html>
